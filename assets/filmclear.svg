    <linearGradient id="background" x1="64" y1="44" x2="460" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243743"/>
      <stop offset="1" stop-color="#101B25"/>
    </linearGradient>
    <linearGradient id="film" x1="85" y1="123" x2="422" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C9C93"/>
      <stop offset="1" stop-color="#8FE5CC"/>
    </linearGradient>
    <linearGradient id="image" x1="245" y1="168" x2="360" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#183D42"/>
      <stop offset="1" stop-color="#0E252F"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="148" y="158" width="216" height="196" rx="15"/>
    </clipPath>
  </defs>
  <rect x="21" y="21" width="470" height="470" rx="104" fill="url(#background)" stroke="#394D59" stroke-width="4"/>
